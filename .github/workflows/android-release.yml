name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name expected in the release artifact, for example 1.0.0
        required: true
        type: string

jobs:
  prod-release:
    name: Build signed prod release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for release signing." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"

      - name: Run unit tests and lint
        run: ./gradlew :app:testDevDebugUnitTest :app:lintDevDebug

      - name: Build prod release artifacts
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PROD_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
          PROD_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PROD_GOOGLE_WEB_CLIENT_ID }}
          PROD_YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
        run: |
          for name in ANDROID_KEYSTORE_FILE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required for release signing." >&2
              exit 1
            fi
          done
          ./gradlew :app:bundleProdRelease :app:assembleProdRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-prod-release-${{ inputs.version_name }}
          path: |
            app/build/outputs/bundle/prodRelease/*.aab
            app/build/outputs/apk/prod/release/*.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-reports-${{ inputs.version_name }}
          path: |
            app/build/test-results/testDevDebugUnitTest
            app/build/reports/tests/testDevDebugUnitTest
            app/build/reports/lint-results-devDebug.*
            app/build/intermediates/lint_intermediate_text_report/devDebug/lintReportDevDebug/lint-results-devDebug.txt
