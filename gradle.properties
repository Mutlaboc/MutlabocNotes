# Общие настройки Gradle для проекта.
# Пользователям IDE (например, Android Studio):
# Настройки Gradle, заданные через IDE, *переопределят*
# любые параметры, указанные в этом файле.
# Подробности о настройке среды сборки:
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Параметры JVM для процесса Gradle Daemon.
# Особенно полезно для тонкой настройки памяти.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# При включении Gradle запускается в экспериментальном параллельном режиме.
# Эту опцию стоит использовать только в развязанных проектах. Подробнее:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Структура пакетов AndroidX помогает отделить пакеты, встроенные в
# Android OS, от тех, что поставляются внутри APK приложения.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Стиль кода Kotlin для проекта: "official" или "obsolete":
kotlin.code.style=official
# Включает отдельный namespace для R-класса каждой библиотеки, чтобы он содержал
# только ресурсы самой библиотеки, без ресурсов её зависимостей,
# что уменьшает размер R-класса этой библиотеки.
android.nonTransitiveRClass=true
